<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>奶蛙的生日宴 · 邀请函</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--paper:#f6ecd6;--dot:#dcc9a6;--ink:#22201f;--red:#a3282d;--cloud:#f6ecd6}
html,body{height:100%}
body{
  font-family:"Kaiti","STKaiti","Songti SC","PingFang SC",serif;
  background:var(--paper);color:var(--ink);overflow:hidden;user-select:none;
  display:flex;justify-content:center;align-items:center;
}
.stage{position:relative;width:100%;max-width:420px;height:100vh;max-height:860px;overflow:hidden;background:var(--paper)}

/* 洒金纸纹 */
.speckle{position:absolute;inset:0;pointer-events:none}
.speckle::before,.speckle::after{
  content:"";position:absolute;inset:0;
  background-image:radial-gradient(circle at 18% 14%,var(--dot) 1.5px,transparent 2px),
                  radial-gradient(circle at 76% 58%,var(--dot) 1.3px,transparent 2px),
                  radial-gradient(circle at 52% 90%,var(--dot) 1.1px,transparent 2px);
  background-size:41px 41px,35px 35px,49px 49px;opacity:.8}
.speckle::after{transform:translate(14px,20px) scale(1.06);opacity:.4}

/* ===== 封面 ===== */
.cover{position:absolute;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;
  padding:0 26px;transition:opacity .45s ease .1s,transform .85s cubic-bezier(.5,.05,.2,1)}
.cover.hide{opacity:0;transform:translateY(-8%) scale(.96);pointer-events:none}

/* 红框：米白底，竖排三字严格居中于框内 */
.frame{
  margin-top:13vh;
  width:min(34vw,146px);height:min(52vh,400px);
  background:#fbf5e9;
  border:3.5px solid var(--red);
  box-shadow:0 0 0 1px rgba(163,40,45,.3),0 16px 44px rgba(120,90,45,.18);
  display:flex;align-items:center;justify-content:center;position:relative;
}
.frame::before{content:"";position:absolute;inset:6px;border:1px solid rgba(163,40,45,.42)}
.title{
  writing-mode:vertical-rl;font-size:min(14.6vw,62px);line-height:1.5;
  letter-spacing:.42em;font-weight:700;color:var(--ink);
  text-shadow:1px 1px 0 rgba(255,255,255,.6);
  margin:auto;padding:.3em 0;
  /* 竖直居中：从框体中轴开始排，字距让三字居中 */
  transform:translateX(calc(.19em - 50% + 50%));
}

.cloud{position:absolute;left:0;right:0;bottom:-2px;height:24vh;pointer-events:none;
  background:radial-gradient(ellipse 64% 60% at 20% 76%,var(--paper) 56%,transparent 61%),
             radial-gradient(ellipse 72% 64% at 82% 80%,var(--paper) 56%,transparent 61%),
             radial-gradient(ellipse 120% 90% at 50% 100%,var(--paper) 62%,transparent 68%)}

.hint{position:absolute;right:22px;bottom:8vh;writing-mode:vertical-rl;color:var(--red);
  font-size:14px;letter-spacing:.5em;animation:pulse 1.6s ease-in-out infinite;z-index:12}
.hint b{display:block;font-weight:400;opacity:.8;margin-top:12px;letter-spacing:.4em;font-size:12px}

/* ===== 内页 ===== */
.letter{position:absolute;inset:0;z-index:5;background:var(--paper);padding:32px 24px 40px;
  overflow-y:auto;opacity:0;transform:translateY(16px);
  transition:opacity .55s ease .25s,transform .55s cubic-bezier(.2,.7,.3,1) .25s;-webkit-overflow-scrolling:touch}
.letter.show{opacity:1;transform:translateY(0)}
.lx-head{text-align:center;margin-bottom:4px}
.lx-eyebrow{display:inline-block;font-size:11px;letter-spacing:.6em;color:var(--red);
  border:1px solid rgba(163,40,45,.55);padding:3px 10px 3px 13px;border-radius:2px}
.lx-title{font-size:26px;font-weight:700;margin:13px 0 3px;letter-spacing:.14em}
.lx-sub{font-size:12.5px;color:#8a7656;letter-spacing:.22em}

@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}

<body>
<div class="stage" id="stage">
  <div class="speckle"></div>

  <div class="cover" id="cover">
    <div class="frame"><div class="title">邀請函</div></div>
    <div class="frog-wrap"><div class="cloud"></div><div class="frog"></div></div>
    <div class="hint">輕觸啟封<b>點我開席 ▾</b></div>
  </div>

  <div class="letter" id="letter">
    <div class="lx-head">
      <span class="lx-eyebrow">围屋 · 广府味</span>
      <div class="lx-title">奶蛙的生日宴</div>
      <div class="lx-sub">第 24 岁 · 这一席，等你入座</div>
    </div>
    <div class="frog-mini"></div>
    <div class="card">
      <div class="row"><span class="k">贵宾</span><span class="v">尊敬的王先生</span></div>
      <div class="row"><span class="k">日期</span><span class="v big">11月14日 周六</span></div>
      <div class="row"><span class="k">时间</span><span class="v">晚 19:00 </span></div>
      <div class="row"><span class="k">包厢</span><span class="v green">二楼【香云纱包厢】</span></div>
      <div class="row"><span class="k">餐厅</span><span class="v">围屋-广府味</span></div>
      <div class="row"><span class="k">地址</span><span class="v">青秀区如意坊 1 号门牌坊</span></div>
      <div class="row"><span class="k">停车</span><span class="v">如意坊商业停车场<br>或 青秀山西门停车场</span></div>
    </div>
    <div class="quote">蛙生难得几回醉<br>不吃完不许走（惊鸿一瞥）</div>
    <div class="sign">唐宗俊 · 敬邀<br>十一月十四，见</div>
    <button class="close" id="closeBtn">↶ 收起邀请函</button>
  </div>
</div>

<script>
  var cover=document.getElementById('cover'), letter=document.getElementById('letter');
  function open_(){cover.classList.add('hide');letter.classList.add('show');try{window.scrollTo(0,0)}catch(e){}}
  function close_(){letter.classList.remove('show');cover.classList.remove('hide')}
  cover.addEventListener('click',open_);
  cover.addEventListener('touchstart',function(e){e.preventDefault();open_()},{passive:false});
  document.getElementById('closeBtn').addEventListener('click',close_);
</script>
</body>
</html>
